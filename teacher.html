<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060a1a">
<title>Teacher Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Same palette as the game. The dashboard is dark only, like the game. */
:root{
  --bg:#060a1a; --panel:#0e1430; --panel2:rgba(255,255,255,.05); --line:rgba(170,185,255,.16);
  --text:#eef1ff; --muted:#a3abd0; --gold:#f6c86b; --gold2:#ffe2a6; --teal:#5fe0b5; --coral:#ff7d7d; --violet:#8f7bff;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45}
body{background:radial-gradient(ellipse at 50% -10%,#1b2556 0%,#0b1130 40%,#060a1a 75%) fixed}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--gold2)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.top h1{font-size:1.6rem;flex:1 1 auto}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.muted{color:var(--muted)} .small{font-size:.86rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:12px;font-weight:800;background:var(--panel2);border:1px solid var(--line)}
.btn:hover{border-color:rgba(246,200,107,.5)}
.btn.primary{background:linear-gradient(180deg,#ffd98a,#f0b44c);color:#2a1c00;border:0}
.btn.small{min-height:32px;padding:0 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-weight:800;margin:14px 0 6px}
input[type=text],input[type=password],select{width:100%;height:44px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.25);padding:0 12px;outline:none;font-weight:700}
input:focus,select:focus{border-color:var(--gold)}
.check{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:12px}
.err{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,125,125,.12);color:#ffc4c4}
.connect{max-width:560px;margin:40px auto 0}
.connect p{margin:8px 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1 1 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.tab{padding:8px 14px;border-radius:999px;font-weight:800;color:var(--muted);white-space:nowrap;border:1px solid transparent}
.tab.on{color:var(--text);background:var(--panel2);border-color:var(--line)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--coral);color:#2a0606;font-size:.75rem;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font-family:'Fraunces',Georgia,serif;font-size:1.7rem;line-height:1.1}
.tile span{color:var(--muted);font-size:.85rem;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel h2{font-size:1.15rem;margin-bottom:10px}
.tbl{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid rgba(170,185,255,.08);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.035)}
.pct{font-weight:800}
.pct.lo{color:var(--coral)} .pct.mid{color:var(--gold)} .pct.hi{color:var(--teal)}
.code{font-weight:800;color:var(--gold2);white-space:nowrap}
.q mark,.q b{background:none;color:var(--gold2);font-weight:800}
.wrong{color:#ffb3b3;text-decoration:line-through;text-decoration-color:rgba(255,125,125,.6)}
.flag{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.flag.done{opacity:.55}
.flag-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:6px}
.flag-head .who{font-weight:800}
.flag .q{font-weight:700;margin:4px 0}
.note{margin-top:8px;padding:8px 12px;border-left:3px solid var(--violet);background:rgba(143,123,255,.1);border-radius:0 10px 10px 0}
.flag-foot{display:flex;justify-content:flex-end;margin-top:8px}
.empty{padding:22px;text-align:center;color:var(--muted)}
.demo{margin-bottom:14px;padding:8px 12px;border-radius:10px;background:rgba(95,224,181,.12);color:#c9fbe9;font-weight:700}
.back{margin-bottom:12px}
.sub{margin:18px 0 8px;font-size:1rem}
.bar-cell{display:flex;align-items:center;gap:8px}
.meter{flex:1 1 60px;min-width:40px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
@media (max-width:560px){ .top h1{font-size:1.3rem} td,th{padding:6px 5px} .hide-sm{display:none} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* Teacher dashboard for the revision game.
   Reads the teacher's Google Sheet through its Apps Script web app (teacher-sheet/Code.gs), which only answers
   when the request carries the dashboard key. The key stays in this browser (only if "Remember" is ticked)
   and is sent in the body of the request, never in the address. ?demo shows made-up data. */
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbye6s5Fp1dplPyLlJQv-l7Q-Mc8zMkgxBu34xU2jxJL7uxx8VXUn1ThVndrDnS0K_YmeA/exec';
const LS = 'efTeacher.v1';
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

let cfg = { url: DEFAULT_URL, key: '', remember: true };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem(LS, JSON.stringify(cfg.remember ? cfg : { url: cfg.url, remember: false })); } catch (e) {} };

let D = null;              // the data, tidied
let view = { tab: 'overview', days: 30, showDone: false, student: null, topic: null };
let busy = false, error = '';

/* ---------- talking to the Sheet ---------- */
async function call(body){
  const r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const t = await r.text();
  try { return JSON.parse(t); } catch (e) { throw new Error(t.trim() === 'ignored' ? 'old' : 'notjson'); }
}
async function load(){
  busy = true; error = ''; render();
  try {
    const d = DEMO ? demoData() : await call({ v: 2, type: 'dash', key: cfg.key });
    if (!d.ok){ error = d.error === 'key' ? 'That dashboard key is not right. Check cell E3 of the Summary tab in your Sheet.' : 'The Sheet sent back an error.'; D = null; }
    else { D = tidy(d); saveCfg(); }
  } catch (e){
    D = null;
    error = e.message === 'old' ? 'The Sheet’s script is the old version, which cannot send data to the dashboard. Paste the new Code.gs into Apps Script, run setup, and deploy a new version (see SETUP.md).'
      : e.message === 'notjson' ? 'That address did not answer like the revision game’s Sheet. Check the web app address.'
      : 'Could not reach the Sheet. Check your internet connection and the web app address.';
  }
  busy = false; render();
}
async function setDone(id, done){
  const f = D.flags.find(x => x.id === id); if (!f) return;
  f.done = done; render();
  if (DEMO) return;
  try { const r = await call({ v: 2, type: 'done', key: cfg.key, flag: id, done }); if (!r.ok) throw 0; }
  catch (e){ f.done = !done; render(); alert('Could not update the Sheet. Try again.'); }
}

/* ---------- shaping the rows ---------- */
const nameKey = n => String(n).trim().toLowerCase().replace(/\s+/g, ' ');
function tidy(d){
  const titles = {};
  const rounds = (d.rounds || []).map(r => ({ at: new Date(r[0]), name: String(r[1]).trim(), sec: r[2], topic: String(r[3]), title: r[4], game: r[5], c: +r[6] || 0, t: +r[7] || 0, pct: +r[8] || 0, secs: +r[9] || 0 }))
    .filter(r => r.name && !isNaN(r.at));
  rounds.forEach(r => { if (r.topic && r.topic !== 'Mixed' && r.title) titles[r.topic] = r.title; });
  const mistakes = (d.mistakes || []).map(r => ({ at: new Date(r[0]), name: String(r[1]).trim(), sec: r[2], topic: String(r[3] || ''), q: String(r[4] || ''), a: String(r[5] || '') }))
    .filter(r => r.name && r.q && !isNaN(r.at));
  const flags = (d.flags || []).map(r => ({ at: new Date(r[0]), name: String(r[1]).trim(), sec: r[2], topic: String(r[3] || ''), title: r[4], q: String(r[5] || ''), a: String(r[6] || ''), ok: r[7] === 'yes', note: String(r[8] || ''), qid: r[9], done: r[10] === true || r[10] === 'TRUE', id: String(r[11] || '') }))
    .filter(r => r.name && !isNaN(r.at));
  flags.forEach(f => { if (f.topic && f.title) titles[f.topic] = titles[f.topic] || f.title; });
  return { rounds, mistakes, flags, titles, sheet: d.sheet || '', url: d.url || '', keepDays: d.keepDays, loaded: new Date() };
}
const since = () => view.days ? Date.now() - view.days * 864e5 : 0;
const inRange = r => r.at.getTime() >= since();
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
const topicName = c => D.titles[c] || '';

function students(){
  const by = {};
  D.rounds.filter(inRange).forEach(r => {
    const k = nameKey(r.name), s = by[k] = by[k] || { k, name: r.name, games: 0, secs: 0, pcts: [], last: r.at, topics: new Set() };
    s.games++; s.secs += r.secs; s.pcts.push(r.pct); s.topics.add(r.topic);
    if (r.at >= s.last){ s.last = r.at; s.name = r.name; }
  });
  D.flags.filter(f => !f.done).forEach(f => { const s = by[nameKey(f.name)]; if (s) s.open = (s.open || 0) + 1; });
  return Object.values(by).map(s => ({ ...s, avg: avg(s.pcts) })).sort((a, b) => b.last - a.last);
}
function topics(filter){
  const by = {};
  D.rounds.filter(inRange).filter(filter || (() => true)).forEach(r => {
    if (!r.topic || r.topic === 'Mixed') return;
    const t = by[r.topic] = by[r.topic] || { code: r.topic, sec: r.sec, games: 0, pcts: [], who: new Set() };
    t.games++; t.pcts.push(r.pct); t.who.add(nameKey(r.name));
  });
  return Object.values(by).map(t => ({ ...t, avg: avg(t.pcts) })).sort((a, b) => a.avg - b.avg);
}
function missed(filter){
  const by = {};
  D.mistakes.filter(inRange).filter(filter || (() => true)).forEach(m => {
    const k = m.topic + '|' + m.q, x = by[k] = by[k] || { topic: m.topic, q: m.q, n: 0, who: new Set(), answers: {} };
    x.n++; x.who.add(nameKey(m.name)); if (m.a) x.answers[m.a] = (x.answers[m.a] || 0) + 1;
  });
  return Object.values(by).sort((a, b) => b.n - a.n || b.who.size - a.who.size);
}

/* ---------- formatting ---------- */
const pct = p => `<span class="pct ${p < 60 ? 'lo' : p < 80 ? 'mid' : 'hi'}">${Math.round(p)}%</span>`;
const mins = s => s < 90 ? Math.round(s) + ' s' : Math.round(s / 60) + ' min';
function when(d){
  const m = (Date.now() - d) / 6e4;
  if (m < 60) return Math.max(1, Math.round(m)) + ' min ago';
  if (m < 1440) return Math.round(m / 60) + ' h ago';
  if (m < 1440 * 7) return Math.round(m / 1440) + ' d ago';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
const stamp = d => d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const topicCell = c => c ? `<span class="code">${esc(c)}</span> ${esc(topicName(c))}` : '<span class="muted">Mixed</span>';
const answers = x => Object.entries(x.answers).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([a, n]) => `<span class="wrong">${esc(a)}</span>${n > 1 ? ` <span class="muted">×${n}</span>` : ''}`).join(', ');
const table = (head, rows, empty) => rows.length
  ? `<div class="tbl"><table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`
  : `<div class="empty">${empty}</div>`;

/* ---------- screens ---------- */
function render(){
  const app = $('#app');
  if (!D){ app.innerHTML = connectScreen(); return; }
  const open = D.flags.filter(f => !f.done).length;
  const tabs = [['overview', 'Overview'], ['flags', 'Flags' + (open ? `<span class="badge">${open}</span>` : '')], ['students', 'Students'], ['topics', 'Topics'], ['questions', 'Most-missed questions']];
  app.innerHTML = `
    <div class="top"><div><div class="eyebrow">Revision game</div><h1>Teacher dashboard</h1></div>
      <div class="muted small">${esc(D.sheet)}${D.url && !DEMO ? ` · <a href="${esc(D.url)}" target="_blank" rel="noopener">Open the Sheet</a>` : ''}<br>Loaded ${stamp(D.loaded)}</div></div>
    ${DEMO ? '<div class="demo">Sample data: these students and results are made up.</div>' : ''}
    <div class="bar">
      <select id="days" aria-label="Period" style="width:auto">
        ${[[7, 'Last 7 days'], [30, 'Last 30 days'], [90, 'Last 90 days'], [0, 'Everything kept']].map(([v, l]) => `<option value="${v}" ${view.days === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select>
      <span class="grow"></span>
      <button class="btn small" data-act="refresh" ${busy ? 'disabled' : ''}>${busy ? 'Loading…' : 'Refresh'}</button>
      ${DEMO ? '' : '<button class="btn small" data-act="forget">Sign out on this device</button>'}
    </div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${view.tab === k ? 'on' : ''}" data-tab="${k}" role="tab">${l}</button>`).join('')}</div>
    <div id="body">${({ overview, flags: flagsView, students: studentsView, topics: topicsView, questions: questionsView })[view.tab]()}</div>`;
}

function connectScreen(){
  return `<div class="connect panel">
    <div class="eyebrow">Revision game</div><h1 style="margin:4px 0 8px">Teacher dashboard</h1>
    <p class="muted">See your students’ shared results, the questions they flag, and the topics they find hardest. The data comes from your Google Sheet.</p>
    <label for="url">Web app address</label>
    <input id="url" type="text" value="${esc(cfg.url)}" autocomplete="off" spellcheck="false">
    <label for="key">Dashboard key</label>
    <input id="key" type="password" value="${esc(cfg.key)}" autocomplete="off" spellcheck="false" placeholder="From cell E3 of the Summary tab">
    <label class="check"><input type="checkbox" id="remember" ${cfg.remember ? 'checked' : ''}> Remember on this device</label>
    <p class="muted small">Only tick this on your own computer or phone. Anyone with the key can read your students’ results.</p>
    ${error ? `<div class="err">${esc(error)}</div>` : ''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
      <button class="btn primary" data-act="connect" ${busy ? 'disabled' : ''}>${busy ? 'Loading…' : 'Open dashboard'}</button>
      <a class="btn" href="?demo">See it with sample data</a>
    </div></div>`;
}

function overview(){
  const R = D.rounds.filter(inRange), S = students(), T = topics().filter(t => t.games >= 2).slice(0, 6), open = D.flags.filter(f => !f.done);
  const recent = R.slice().sort((a, b) => b.at - a.at).slice(0, 10);
  return `
    <div class="tiles">
      <div class="tile"><b>${S.length}</b><span>students active</span></div>
      <div class="tile"><b>${R.length}</b><span>games played</span></div>
      <div class="tile"><b>${Math.round(R.reduce((s, r) => s + r.secs, 0) / 60)}</b><span>minutes played</span></div>
      <div class="tile"><b>${R.length ? Math.round(avg(R.map(r => r.pct))) + '%' : '–'}</b><span>average score</span></div>
      <div class="tile"><b>${open.length}</b><span>flags to look at</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Recent games</h2>
        ${table('<th>Student</th><th>Topic</th><th class="n">Score</th><th class="n">When</th>',
          recent.map(r => `<tr class="click" data-student="${esc(nameKey(r.name))}"><td>${esc(r.name)}</td><td>${topicCell(r.topic === 'Mixed' ? '' : r.topic)}<div class="muted small">${esc(r.game || r.title)}</div></td><td class="n">${pct(r.pct)}<div class="muted small">${r.c}/${r.t}</div></td><td class="n muted">${when(r.at)}</td></tr>`),
          'No games in this period.')}
      </div>
      <div class="panel"><h2>Weakest topics</h2>
        ${table('<th>Topic</th><th class="n">Games</th><th class="n">Average</th>',
          T.map(t => `<tr class="click" data-topic="${esc(t.code)}"><td>${topicCell(t.code)}</td><td class="n">${t.games}</td><td class="n">${pct(t.avg)}</td></tr>`),
          'Not enough games yet.')}
        ${open.length ? `<p style="margin:14px 0 0"><button class="btn small" data-tab="flags">${open.length} flag${open.length === 1 ? '' : 's'} to look at →</button></p>` : ''}
      </div>
    </div>`;
}

function flagCard(f){
  return `<div class="flag ${f.done ? 'done' : ''}">
    <div class="flag-head"><span class="who">${esc(f.name)}</span><span class="muted small">${stamp(f.at)}</span><span class="small">${topicCell(f.topic)}</span></div>
    <div class="q">${esc(f.q)}</div>
    ${f.a ? `<div class="small">Their answer: <span class="${f.ok ? '' : 'wrong'}">${esc(f.a)}</span>${f.ok ? ' <span class="muted">(marked correct)</span>' : ''}</div>` : `<div class="small muted">${f.ok ? 'They got this one right.' : ''}</div>`}
    ${f.note ? `<div class="note">${esc(f.note)}</div>` : ''}
    <div class="flag-foot">${f.id ? `<button class="btn small" data-done="${esc(f.id)}" data-val="${f.done ? 0 : 1}">${f.done ? 'Mark as not done' : 'Mark as done'}</button>` : ''}</div>
  </div>`;
}
function flagsView(list){
  const all = (list || D.flags).slice().sort((a, b) => b.at - a.at);
  const open = all.filter(f => !f.done), done = all.filter(f => f.done);
  return `${open.length ? open.map(flagCard).join('') : '<div class="empty">No flags waiting. Students can flag a question from the answer box when sharing is on.</div>'}
    ${done.length ? `<p><button class="btn small" data-act="toggleDone">${view.showDone ? 'Hide' : 'Show'} ${done.length} done</button></p>${view.showDone ? done.map(flagCard).join('') : ''}` : ''}
    <p class="muted small">Flags are shown whatever the period. Like everything in the Sheet, they are deleted after ${D.keepDays || 180} days.</p>`;
}

function studentsView(){
  if (view.student) return studentDetail(view.student);
  const S = students();
  return `<div class="panel">${table('<th>Student</th><th class="n">Games</th><th class="n hide-sm">Time</th><th class="n">Average</th><th class="n hide-sm">Topics</th><th class="n">Last played</th>',
    S.map(s => `<tr class="click" data-student="${esc(s.k)}"><td><b>${esc(s.name)}</b>${s.open ? `<span class="badge" title="Flags to look at">${s.open}</span>` : ''}</td><td class="n">${s.games}</td><td class="n hide-sm">${mins(s.secs)}</td><td class="n">${pct(s.avg)}</td><td class="n hide-sm">${s.topics.size}</td><td class="n muted">${when(s.last)}</td></tr>`),
    'No one has shared results in this period.')}
    <p class="muted small" style="margin:10px 0 0">Students are grouped by the name they typed, ignoring capitals. Someone who changes their name shows up twice.</p></div>`;
}
function studentDetail(k){
  const mine = r => nameKey(r.name) === k;
  const R = D.rounds.filter(inRange).filter(mine).sort((a, b) => b.at - a.at);
  const name = (R[0] || D.flags.find(mine) || { name: k }).name;
  const T = topics(mine), M = missed(mine).slice(0, 30), F = D.flags.filter(mine);
  return `<button class="btn small back" data-back="student">← All students</button>
    <h2 style="margin-bottom:12px">${esc(name)}</h2>
    <div class="tiles">
      <div class="tile"><b>${R.length}</b><span>games</span></div>
      <div class="tile"><b>${mins(R.reduce((s, r) => s + r.secs, 0))}</b><span>played</span></div>
      <div class="tile"><b>${R.length ? Math.round(avg(R.map(r => r.pct))) + '%' : '–'}</b><span>average score</span></div>
      <div class="tile"><b>${R[0] ? when(R[0].at) : '–'}</b><span>last played</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Topics, weakest first</h2>${table('<th>Topic</th><th class="n">Games</th><th class="n">Average</th>',
        T.map(t => `<tr class="click" data-topic="${esc(t.code)}"><td>${topicCell(t.code)}</td><td class="n">${t.games}</td><td class="n">${pct(t.avg)}</td></tr>`), 'No single-topic games in this period.')}</div>
      <div class="panel"><h2>Recent games</h2>${table('<th>Topic</th><th class="n">Score</th><th class="n">When</th>',
        R.slice(0, 15).map(r => `<tr><td>${topicCell(r.topic === 'Mixed' ? '' : r.topic)}<div class="muted small">${esc(r.game || r.title)}</div></td><td class="n">${pct(r.pct)}<div class="muted small">${r.c}/${r.t}</div></td><td class="n muted">${when(r.at)}</td></tr>`), 'No games in this period.')}</div>
    </div>
    <h3 class="sub">Questions they got wrong</h3>
    <div class="panel">${table('<th>Topic</th><th>Question (correct answer)</th><th>They wrote</th><th class="n">Times</th>',
      M.map(x => `<tr><td class="code">${esc(x.topic)}</td><td class="q">${esc(x.q)}</td><td>${answers(x)}</td><td class="n">${x.n}</td></tr>`), 'No mistakes in this period.')}</div>
    ${F.length ? `<h3 class="sub">Their flags</h3>${F.slice().sort((a, b) => b.at - a.at).map(flagCard).join('')}` : ''}`;
}

function topicsView(){
  if (view.topic) return topicDetail(view.topic);
  const T = topics();
  return `<div class="panel">${table('<th>Topic</th><th class="hide-sm">Section</th><th class="n">Games</th><th class="n">Students</th><th class="n">Average</th>',
    T.map(t => `<tr class="click" data-topic="${esc(t.code)}"><td>${topicCell(t.code)}</td><td class="hide-sm muted">${esc(t.sec)}</td><td class="n">${t.games}</td><td class="n">${t.who.size}</td><td class="n"><div class="bar-cell"><span class="meter"><i style="width:${Math.round(t.avg)}%"></i></span>${pct(t.avg)}</div></td></tr>`),
    'No single-topic games in this period.')}
    <p class="muted small" style="margin:10px 0 0">Weakest first. Mixed revision, weak spots and mistakes reviews cover several topics, so they are left out here; their wrong answers still count under Most-missed questions.</p></div>`;
}
function topicDetail(c){
  const here = r => r.topic === c;
  const R = D.rounds.filter(inRange).filter(here);
  const by = {};
  R.forEach(r => { const k = nameKey(r.name), s = by[k] = by[k] || { k, name: r.name, pcts: [], last: r.at }; s.pcts.push(r.pct); if (r.at >= s.last){ s.last = r.at; s.name = r.name; } });
  const S = Object.values(by).map(s => ({ ...s, avg: avg(s.pcts) })).sort((a, b) => a.avg - b.avg);
  const M = missed(here).slice(0, 40);
  return `<button class="btn small back" data-back="topic">← All topics</button>
    <h2 style="margin-bottom:12px">${topicCell(c)}</h2>
    <div class="grid2">
      <div class="panel"><h2>Students, weakest first</h2>${table('<th>Student</th><th class="n">Games</th><th class="n">Average</th>',
        S.map(s => `<tr class="click" data-student="${esc(s.k)}"><td>${esc(s.name)}</td><td class="n">${s.pcts.length}</td><td class="n">${pct(s.avg)}</td></tr>`), 'No games on this topic in this period.')}</div>
      <div class="panel"><h2>Most-missed questions</h2>${table('<th>Question (correct answer)</th><th>Wrong answers</th><th class="n">Times</th>',
        M.map(x => `<tr><td class="q">${esc(x.q)}</td><td>${answers(x)}</td><td class="n">${x.n}<div class="muted small">${x.who.size} student${x.who.size === 1 ? '' : 's'}</div></td></tr>`), 'No mistakes on this topic in this period.')}</div>
    </div>`;
}

function questionsView(){
  const M = missed().slice(0, 60);
  return `<div class="panel">${table('<th>Topic</th><th>Question (correct answer)</th><th>Wrong answers</th><th class="n">Times</th>',
    M.map(x => `<tr><td>${x.topic ? `<span class="code click" data-topic="${esc(x.topic)}" style="cursor:pointer">${esc(x.topic)}</span>` : ''}</td><td class="q">${esc(x.q)}</td><td>${answers(x)}</td><td class="n">${x.n}<div class="muted small">${x.who.size} student${x.who.size === 1 ? '' : 's'}</div></td></tr>`),
    'No mistakes in this period.')}</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-tab],[data-student],[data-topic],[data-done],[data-back]'); if (!t) return;
  if (t.dataset.tab){ view.tab = t.dataset.tab; view.student = view.topic = null; }
  else if (t.dataset.student){ view.tab = 'students'; view.student = t.dataset.student; }
  else if (t.dataset.topic){ view.tab = 'topics'; view.topic = t.dataset.topic; }
  else if (t.dataset.back){ view[t.dataset.back] = null; }
  else if (t.dataset.done){ setDone(t.dataset.done, t.dataset.val === '1'); return; }
  else switch (t.dataset.act){
    case 'connect':
      cfg.url = $('#url').value.trim(); cfg.key = $('#key').value.trim(); cfg.remember = $('#remember').checked;
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(cfg.url)){ error = 'The web app address should start with https://script.google.com/macros/s/ and end with /exec.'; render(); return; }
      if (!cfg.key){ error = 'Please paste the dashboard key.'; render(); return; }
      load(); return;
    case 'refresh': load(); return;
    case 'forget': cfg.key = ''; saveCfg(); D = null; error = ''; break;
    case 'toggleDone': view.showDone = !view.showDone; break;
  }
  render(); window.scrollTo(0, 0);
});
document.addEventListener('change', ev => { if (ev.target.id === 'days'){ view.days = +ev.target.value; render(); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !D && (ev.target.id === 'key' || ev.target.id === 'url')) $('[data-act=connect]').click(); });

/* ---------- sample data for ?demo ---------- */
function demoData(){
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647, pick = a => a[Math.floor(rnd() * a.length)];
  const names = ['Ana', 'Bruno', 'Chiara', 'Daniel', 'Elif', 'Fatima', 'Giorgos', 'Hana', 'Ivan', 'Julia', 'Kenji', 'Lucía'];
  const T = [['9A', 'Present perfect + yet, just, already', 'Grammar', [['Have you finished your homework ___? (yet)', 'already'], ['I’ve ___ seen her. She left a minute ago. (just)', 'yet']]],
    ['9B', 'Present perfect + for and since', 'Grammar', [['I’ve lived here since 2010.', 'for 2010'], ['She’s worked there for six months.', 'since six months']]],
    ['9C', 'Present perfect or past simple? (2)', 'Grammar', [['He was born in 1990.', 'has been born'], ['They got married last year.', 'have got married']]],
    ['10A', 'Expressing movement', 'Grammar', [['The ball went through the window.', 'across'], ['We walked across the bridge.', 'through']]],
    ['V9B', 'Fear; phrases with for and since', 'Vocabulary', [['I feel dizzy when I look down.', 'dizy'], ['She was terrified of spiders.', 'terrifying']]],
    ['V10A', 'Sports', 'Vocabulary', [['I play tennis on Saturdays.', 'do'], ['He goes cycling every day.', 'plays']]]];
  const games = ['Forge', 'Choice', 'Error hunt', 'Sort'], now = Date.now();
  const rounds = [], mistakes = [], flags = [];
  names.forEach((n, i) => {
    const skill = 0.55 + rnd() * 0.4, count = 3 + Math.floor(rnd() * 14);
    for (let j = 0; j < count; j++){
      const at = new Date(now - rnd() * 40 * 864e5), tp = pick(T), t = 10, c = Math.min(t, Math.round(t * (skill + (rnd() - .5) * .3)));
      rounds.push([at.toISOString(), n, tp[2], tp[0], tp[1], pick(games), c, t, Math.round(100 * c / t), 60 + Math.round(rnd() * 240), at.toISOString(), '']);
      for (let k = 0; k < t - c; k++){ const q = pick(tp[3]); mistakes.push([at.toISOString(), n, tp[2], tp[0], q[0], q[1]]); }
    }
  });
  [['Daniel', 0, 'I wrote "already" because the question means I expect it is done. Is that wrong?', false, 'already'],
   ['Elif', 1, '', false, 'for 2010'], ['Hana', 3, 'Is "across" also OK here?', true, 'through'], ['Ivan', 4, 'What does dizzy mean?', true, 'dizzy']]
    .forEach(([n, ti, note, ok, a], i) => { const tp = T[ti], at = new Date(now - (i + 1) * 9e6); flags.push([at.toISOString(), n, tp[2], tp[0], tp[1], tp[3][0][0], a, ok ? 'yes' : 'no', note, tp[0] + 'g1', i === 3, 'demo' + i]); });
  const sort = a => a.sort((x, y) => x[0] < y[0] ? -1 : 1);
  return { ok: true, version: 2, keepDays: 180, sheet: 'Sample class', url: '', rounds: sort(rounds), mistakes: sort(mistakes), flags };
}

if (DEMO || cfg.key) load(); else render();
