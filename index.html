<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a1a">
<title>Grammar Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a1a; --panel:rgba(13,19,44,.88); --panel2:rgba(255,255,255,.055); --line:rgba(170,185,255,.16);
  --text:#eef1ff; --muted:#a3abd0; --gold:#f6c86b; --gold2:#ffe2a6; --teal:#5fe0b5; --coral:#ff7d7d; --violet:#8f7bff;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:radial-gradient(ellipse at 50% -10%,#1b2556 0%,#0b1130 45%,#060a1a 80%)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 32px);min-height:100vh;min-height:100dvh}
.screen{display:none}
.screen.active{display:block;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:800;font-size:1rem;transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1b00;box-shadow:0 4px 18px rgba(246,200,107,.25)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.small{min-height:40px;padding:0 14px;font-size:.9rem}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.back-btn{flex:none;padding:0 12px 0 8px;gap:4px;min-height:44px}

/* ---------- home ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-size:1.9rem;line-height:1.05;margin-top:4px}
.level-card{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.lvl-badge{width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:'Fraunces',serif;font-size:1.6rem;font-weight:700;color:#2a1b00;background:radial-gradient(circle at 35% 30%,#fff3cf,var(--gold) 60%,#b98a2e);box-shadow:0 0 24px rgba(246,200,107,.45)}
.lvl-info{flex:1;min-width:0}
.lvl-title{font-weight:800;font-size:1.05rem}
.xpbar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 4px}
.xpbar>div{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--violet),var(--gold));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.session-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:12px}
.session-strip .s-num{font-weight:800}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.quick .btn{min-height:62px;font-size:1rem;line-height:1.15;text-align:center;flex-direction:column;gap:2px}
.unit{margin-bottom:18px}
.unit-head{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.unit-head .u{font-family:'Fraunces',serif;font-weight:700;font-size:1.15rem}
.unit-head .t{color:var(--muted);font-size:.86rem}
.pgrid{display:grid;grid-template-columns:1fr;gap:8px}
.pcard{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);transition:transform .12s,border-color .2s}
.pcard:active{transform:scale(.985)}
.pcard:hover{border-color:rgba(246,200,107,.4)}
.pc-id{grid-row:span 2;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:rgba(143,123,255,.16);color:#cfc6ff;font-size:.95rem}
.pc-title{font-weight:800;line-height:1.2}
.pc-sub{color:var(--muted);font-size:.82rem;line-height:1.25;grid-column:2}
.stars{grid-row:span 2;font-size:.95rem;letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:rgba(255,255,255,.18)} .stars i.on{color:var(--gold);text-shadow:0 0 8px rgba(246,200,107,.6)}
.foot{display:flex;gap:10px;justify-content:center;margin-top:8px}

/* ---------- point ---------- */
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.point-hero{text-align:center;padding:22px 18px;margin-bottom:14px}
.point-hero .code{font-weight:800;color:#cfc6ff;letter-spacing:.08em}
.point-hero h2{font-size:1.7rem;margin:4px 0}
.point-hero .stars{font-size:1.4rem;margin-top:8px;display:block}
.modes{display:grid;gap:10px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.mode:active{transform:scale(.985)}
.mode .mi{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;background:linear-gradient(160deg,rgba(246,200,107,.22),rgba(143,123,255,.18))}
.mode .mi svg{width:26px;height:26px;stroke:var(--gold2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode .mn{font-weight:800;font-size:1.05rem}
.mode .md{color:var(--muted);font-size:.85rem;line-height:1.3}

/* ---------- game ---------- */
.hud{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;padding-top:2px}
.hud-mid{flex:1;min-width:0}
.hud-title{font-size:.8rem;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.prog>div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .4s}
.hud-right{text-align:right;min-width:62px}
.streak{font-weight:800;font-size:.85rem;color:var(--muted);transition:color .3s}
.streak.hot{color:var(--gold)}
.hudxp{font-weight:800;font-size:.85rem}
.sky-gap{height:max(19vh,120px)}
.ins{color:var(--muted);font-size:.9rem;margin-bottom:10px;font-weight:700}
.ins .key{color:var(--gold2);font-size:1.18em;font-weight:800;padding:0 .08em}
.sent{font-size:1.28rem;line-height:1.5;font-weight:700;margin-bottom:12px}
.sent .spk{color:var(--gold);margin-right:4px}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--gold);color:var(--gold2);padding:0 4px;text-align:center;line-height:1.2}
.blank.sm{min-width:2.6em}
.base{display:inline-block;padding:5px 12px;border-radius:999px;background:rgba(143,123,255,.18);color:#d8d0ff;font-weight:800;margin-bottom:14px}
.gap-form{display:flex;gap:8px}
.gap-form input{flex:1;min-width:0;height:52px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:inherit;font-size:1.1rem;font-weight:700;padding:0 14px;outline:none}
.gap-form input:focus{border-color:var(--gold)}
.opts{display:grid;gap:10px}
.opt{min-height:56px;padding:10px 16px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);font-weight:800;font-size:1.08rem;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .2s,background .2s}
.opt .door{width:30px;height:30px;flex:none;border-radius:8px 8px 3px 3px;display:grid;place-items:center;font-size:.8rem;background:rgba(246,200,107,.16);color:var(--gold)}
.opt.good{border-color:var(--teal);background:rgba(95,224,181,.14)}
.opt.bad{border-color:var(--coral);background:rgba(255,125,125,.13)}
.chunks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chunk{padding:10px 13px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-weight:800;font-size:1.08rem;transition:all .2s}
.chunk.found{border-color:var(--gold);background:rgba(246,200,107,.16)}
.chunk.miss{border-color:var(--coral);background:rgba(255,125,125,.12);text-decoration:line-through}
.chunk.actual{border-color:var(--gold);box-shadow:0 0 0 3px rgba(246,200,107,.25)}
.fixlabel{font-weight:800;color:var(--gold2);margin:4px 0 8px;font-size:.95rem}
/* sort */
.card-stage{height:190px;display:grid;place-items:center;margin:6px 0 14px;perspective:800px}
.sort-card{width:min(86%,340px);min-height:130px;padding:20px;border-radius:20px;display:grid;place-items:center;text-align:center;font-size:1.3rem;font-weight:800;line-height:1.35;
  background:linear-gradient(160deg,#20295e,#151b40);border:1px solid rgba(246,200,107,.35);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 30px rgba(143,123,255,.15);touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.sort-card.drag{transition:none}
.sort-card.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.bins{display:grid;gap:10px}
.bins.b2{grid-template-columns:1fr 1fr}
.bins.b3{grid-template-columns:1fr 1fr 1fr}
.bin{min-height:64px;padding:8px;border-radius:14px;background:var(--panel2);border:2px dashed rgba(170,185,255,.3);font-weight:800;font-size:.98rem;line-height:1.2;transition:all .2s}
.bin.hint{border-style:solid;border-color:var(--teal);background:rgba(95,224,181,.14)}
.bin.lean{border-color:var(--gold);background:rgba(246,200,107,.14)}
/* match */
.match{display:grid;gap:14px}
.mcol{display:grid;gap:8px}
.mcol .lab{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
.mb{text-align:left;padding:11px 13px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-weight:700;font-size:1rem;line-height:1.3;display:flex;gap:10px;align-items:center;transition:all .2s}
.mb .pn{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:rgba(255,255,255,.08);color:var(--muted)}
.mb.sel{border-color:var(--gold);background:rgba(246,200,107,.14)}
.mb.done{border-color:var(--teal);background:rgba(95,224,181,.1);opacity:.85}
.mb.done .pn{background:var(--teal);color:#06261b}
.mb.err{border-color:var(--coral);animation:shake .35s}
/* feedback */
.fb{margin-top:14px;padding:14px;border-radius:14px;border:1px solid;animation:fadeUp .25s ease both}
.fb.ok{border-color:rgba(95,224,181,.45);background:rgba(95,224,181,.08)}
.fb.bad{border-color:rgba(255,125,125,.45);background:rgba(255,125,125,.07)}
.fb-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.05rem;margin-bottom:6px}
.fb.ok .fb-head{color:var(--teal)} .fb.bad .fb-head{color:var(--coral)}
.fb-xp{color:var(--gold);font-size:.95rem}
.fb-sent{font-size:1.08rem;font-weight:700;margin:4px 0}
.fb-sent mark,.rev mark{background:none;color:var(--gold2);border-bottom:2px solid var(--gold);padding:0 2px}
.fb-your{color:var(--muted);font-size:.9rem}
.fb-also,.fb-note{font-size:.9rem;color:var(--muted);margin-top:4px}
.fb-note{color:var(--gold2)}
.fb-rule{margin-top:8px;padding:10px 12px;border-radius:10px;background:rgba(143,123,255,.12);font-size:.92rem;line-height:1.4}
.fb-rule::before{content:'Rule  ';font-weight:800;color:#cfc6ff;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.fb-rule.hide-rule{display:none}
.fb-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.fb-actions .primary{min-width:120px}
/* results & report */
.result{text-align:center}
.big-score{font-family:'Fraunces',serif;font-size:4.2rem;font-weight:700;line-height:1;margin:10px 0 2px}
.big-score span{font-size:2rem;color:var(--muted)}
.res-msg{font-size:1.1rem;font-weight:800;margin:6px 0}
.res-xp{display:inline-block;margin:6px 0 14px;padding:6px 16px;border-radius:999px;background:rgba(246,200,107,.16);color:var(--gold);font-weight:800;font-size:1.1rem}
.btn-col{display:grid;gap:10px;margin-top:16px}
details.rev{text-align:left;margin-top:10px;background:var(--panel2);border-radius:12px;padding:10px 14px}
details.rev summary{font-weight:800;cursor:pointer}
.rev-item{padding:9px 0;border-top:1px solid var(--line);font-size:.95rem}
.rev-item .yw{color:var(--coral);font-size:.85rem}
.report-head{text-align:center;margin-bottom:6px}
.grade{font-family:'Fraunces',serif;font-size:1.5rem;color:var(--gold);margin-top:2px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35rem;font-family:'Fraunces',serif}
.stat span{font-size:.75rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.bars{display:grid;gap:7px;margin-top:6px}
.bar{display:grid;grid-template-columns:2.6em 1fr auto;gap:8px;align-items:center;font-size:.88rem}
.bar .bt{height:12px;border-radius:7px;background:rgba(255,255,255,.07);overflow:hidden}
.bar .bt div{height:100%;border-radius:7px}
.bar .bv{text-align:right;font-weight:800;color:var(--muted);white-space:nowrap;min-width:6.2em}
.focus-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:5px 10px;border-radius:999px;background:rgba(255,125,125,.14);color:#ffc2c2;font-weight:800;font-size:.82rem}
.sec-title{font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.list{display:grid;gap:6px}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--panel2);font-size:.9rem}
.li b{font-weight:800}
.stamp{font-size:.78rem;color:var(--muted);text-align:center;margin-top:12px}
.help p{margin:.4em 0 .9em}
.help h3{font-size:1.1rem;margin-top:14px}
/* overlay + toast */
.overlay{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(3,6,18,.7);padding:24px}
.overlay.show{display:grid;animation:fadeUp .3s ease}
.overlay .panel{text-align:center;max-width:360px}
.overlay .lvl-badge{width:96px;height:96px;font-size:2.6rem;margin:6px auto 10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(30px);opacity:0;z-index:30;padding:10px 18px;border-radius:999px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1b00;font-weight:800;pointer-events:none;transition:all .3s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body[data-theme="clock"]{
  --bg:#140d08; --panel:rgba(40,27,16,.9); --panel2:rgba(255,214,160,.06); --line:rgba(232,176,104,.2);
  --text:#fbf0e2; --muted:#cbb59b; --gold:#e9a94b; --gold2:#ffd79a; --teal:#86d9a6; --coral:#ff8068; --violet:#c27a45;
}
body[data-theme="clock"] #sky{background:radial-gradient(ellipse at 50% -10%,#3a2614 0%,#1d130b 50%,#140d08 85%)}
body[data-theme="clock"] .pc-id{background:rgba(194,122,69,.2);color:#ffd0a8}
body[data-theme="clock"] .point-hero .code{color:#ffd0a8}
body[data-theme="clock"] .panel{box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,220,170,.06)}
body[data-theme="clock"] .lvl-badge{background:radial-gradient(circle at 35% 30%,#fff0d6,#e9a94b 60%,#8a5a22)}
body[data-theme="clock"] .fb-rule{background:rgba(194,122,69,.16)}
body[data-theme="clock"] .fb-rule::before{color:#ffd0a8}
body[data-theme="clock"] .base{background:rgba(194,122,69,.2);color:#ffe0c0}
body[data-theme="clock"] h1, body[data-theme="clock"] .door-title{letter-spacing:-.005em}
body[data-theme="clock"] .sort-card{background:linear-gradient(160deg,#5a3b1d,#2e1e10);border-color:rgba(233,169,75,.45);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 30px rgba(233,169,75,.12)}
body[data-theme="clock"] .bin{border-color:rgba(232,176,104,.35)}
body[data-theme="clock"] .opt .door{background:rgba(233,169,75,.16)}
.doors{display:grid;gap:12px;margin:4px 0 18px}
.door-card{display:flex;align-items:center;gap:16px;text-align:left;padding:20px 18px;border-radius:20px;border:1px solid;transition:transform .12s}
.door-card:active{transform:scale(.985)}
.door-card.sky{background:linear-gradient(135deg,#1b2556,#0d1333);border-color:rgba(170,185,255,.25);color:#eef1ff}
.door-card.clock{background:linear-gradient(135deg,#4a2f17,#24170c);border-color:rgba(232,176,104,.35);color:#fbf0e2}
.door-art{width:64px;height:64px;flex:none;display:grid;place-items:center;border-radius:18px}
.door-art svg{width:44px;height:44px}
.door-card.sky .door-art{background:rgba(143,123,255,.18);color:#ffd27a}
.door-card.clock .door-art{background:rgba(233,169,75,.16);color:#e9a94b}
.door-card.clock .door-art svg{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.door-txt{display:flex;flex-direction:column;gap:2px}
.door-title{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.45rem;line-height:1.1}
.door-card.clock .eyebrow{color:#e9a94b}
.door-card .muted{color:inherit;opacity:.72}
.back-row .back-btn{min-height:44px}
.back-btn svg{width:18px;height:18px;flex:none}
@media (min-width:520px){ .pgrid{grid-template-columns:1fr} .top h1{font-size:2.2rem} }
/* ---------- mistakes book ---------- */
.foot{flex-wrap:wrap}
.book-link{justify-content:space-between;margin:-6px 0 18px;min-height:46px}
.bk-count{min-width:26px;padding:1px 9px;border-radius:999px;background:rgba(246,200,107,.16);color:var(--gold2);font-weight:800;text-align:center}
.bk-point{margin:16px 2px 6px;font-weight:700}
.bk-point b{color:var(--gold2)}
.bk-item,.rv-item{padding:10px 12px;border-radius:10px;background:var(--panel2);margin-bottom:6px;font-size:.95rem;line-height:1.4}
.bk-s,.rv-s{font-weight:700;font-size:1.02rem}
.bk-s mark,.rv-s mark{background:none;color:var(--gold2);border-bottom:2px solid var(--gold);padding:0 2px}
.bk-rule{margin:4px 0;font-size:.9rem}
.bk-rule summary{cursor:pointer;color:var(--muted);font-weight:800}
.rv-head{font-size:1.15rem;margin:2px 0 10px}
.rv-head b{color:var(--gold2)}
.bk-text{width:100%;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:.8rem/1.4 ui-monospace,Menlo,Consolas,monospace;padding:8px}
/* ---------- share with teacher ---------- */
.share-link{justify-content:space-between;margin:-6px 0 14px;min-height:46px}
.share-state{padding:10px 12px;border-radius:10px;background:var(--panel2);margin-bottom:6px}
.share-state.on{background:rgba(95,224,181,.12);color:var(--teal)}
.help ul.notice{margin:.2em 0 .9em;padding-left:1.3em}
.help ul.notice li{margin:.15em 0}
.help a{color:var(--gold2)}
.share-lab{display:block;font-weight:800;margin:14px 0 6px}

  pp_just:'just = a very short time ago. It goes before the main verb: I’ve just had lunch.',
  pp_already:'already = earlier than expected. It goes before the main verb: I’ve already done my homework.',
  pp_notime:'Don’t use the present perfect with a finished time (yesterday, ten minutes ago, last year): I cleaned the fridge ten minutes ago NOT I’ve cleaned the fridge ten minutes ago.',
  pp_exp:'Present perfect for experiences in your life, when we don’t say when: Have you ever been to Rome? I’ve never eaten sushi.',
  pp_ps:'Past simple when we say or ask when, or for details (where, who with): I went there in 2019. When did you go?',
  pp_conv:'A conversation often starts with the present perfect and then changes to the past simple for the details: Have you ever lost your phone? – Yes, I have. – Where did you lose it?',
  been_gone:'been to = went and came back (She’s been to Paris three times). gone to = went and is still there (She’s gone to the bank – she isn’t here now).',
  some_pos:'something, somebody (someone), somewhere in positive sentences: I bought something. There’s somebody at the door.',
  any_neg:'anything, anybody (anyone), anywhere in questions and negative sentences: Did you buy anything? I didn’t see anybody.',
  no_word:'nothing, nobody (no one), nowhere with a positive verb, or as a one-word answer: There’s nothing in the fridge. A: Who called? B: Nobody.',
  no_double:'Don’t use two negatives: I didn’t do anything NOT I didn’t do nothing.',
  some_offer:'Use something in offers and requests: Would you like something to drink?',

/* ===================== KEY WORDS (no repeats within a round) =====================
   Each question gets the "key words" its answer depends on: the content words of the correct answer,
   reduced to a rough stem so that bad / worse / worst, busy / busier and take / took all match.
   Grammar words (will, should, have to, the, most, a few …) are ignored; if the answer is only grammar
   words (e.g. "don't have to", "mine"), the next content word after the gap is used instead (the verb or
   noun it goes with). Rounds then avoid two questions that share a key word whenever the pool allows. */
const IRR = {better:'good',best:'good',well:'good',worse:'bad',worst:'bad',badly:'bad',

  felt:'feel',knew:'know',known:'know',thought:'think',left:'leave',kept:'keep',flew:'fly',brought:'bring',heard:'hear',slept:'sleep',
  understood:'understand',began:'begin',begun:'begin',forgot:'forget',forgotten:'forget',rode:'ride',ridden:'ride',drove:'drive',driven:'drive',
  swam:'swim',swum:'swim',read:'read',had:'have',has:'have',children:'child',people:'person',teeth:'tooth',eldest:'old',elder:'old'};

function stem(w){
  w = w.replace(/'/g, ''); if (IRR[w]) w = IRR[w];
  if (w === 'won') return 'win';
  for (const [suf, rep] of [['iest','i'],['ier','i'],['ily','i'],['ies','i'],['ied','i'],['est',''],['ing',''],['ed',''],['er',''],['ly',''],['es',''],['s','']]){
    if (w.endsWith(suf) && w.length - suf.length >= 3 && !(suf === 's' && w.endsWith('ss'))){ w = w.slice(0, -suf.length) + rep; break; }
  }
  w = w.replace(/e$/, '').replace(/y$/, 'i').replace(/([bcdfghjklmnpqrstvwz])\1$/, '$1');
  return w;
}

  let ans, after = '', before = '';
  if (it.k === 'f'){ ans = it.x[0]; after = it.c.slice(it.w + 1).join(' '); before = it.c.slice(0, it.w).join(' '); }

const LEVEL_NAMES = ['Stargazer','Moon Watcher','Comet Chaser','Planet Finder','Star Mapper','Nebula Navigator','Galaxy Guide','Constellation Keeper','Astronomer Royal','Master of the Skies'];
const xpFor = L => 50 * L * (L - 1);
function levelOf(xp){ let L = 1; while (xp >= xpFor(L + 1)) L++; return L; }
const levelName = L => LEVEL_NAMES[Math.min(L, LEVEL_NAMES.length) - 1];
function levelProgress(xp){ const L = levelOf(xp), a = xpFor(L), b = xpFor(L + 1); return { L, into: xp - a, need: b - a, frac: (xp - a) / (b - a) }; }
function mastery(p){
  const s = store.stats[p]; if (!s || !s.r.length) return 0;
  const acc = s.r.reduce((a, b) => a + b, 0) / s.r.length;
  return Math.max(0, Math.min(5, Math.floor(acc * 5 + 0.5), Math.floor(s.r.length / 4)));
}
function recentAcc(p){ const s = store.stats[p]; if (!s || !s.r.length) return null; return s.r.reduce((a, b) => a + b, 0) / s.r.length; }

/* ===================== ANSWER CHECKING ===================== */
function canon(s){
  s = String(s).toLowerCase()
    .replace(/[‘’ʼ`´′]/g, "'")
    .replace(/[“”"()]/g, ' ')
    .replace(/[.!?,;:…]+/g, ' ')
    .replace(/\s+/g, ' ').trim();
  s = s.replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'can not').replace(/\bcannot\b/g, 'can not').replace(/\bshan't\b/g, 'shall not')
       .replace(/n't\b/g, ' not').replace(/'ll\b/g, ' will').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have');
  return s.replace(/\s+/g, ' ').trim();
}
const LOOSE = { dont:'do not', doesnt:'does not', didnt:'did not', wont:'will not', shouldnt:'should not', mustnt:'must not', isnt:'is not', arent:'are not', havent:'have not', hasnt:'has not', cant:'can not' };
function loosen(s){ return s.split(' ').map(w => LOOSE[w] || w).join(' '); }
function checkGap(it, raw){
  const parts = it.t.split('___');
  const prev = canon(parts[0]).split(' ').pop() || '';
  const next = canon(parts[1] || '').split(' ')[0] || '';
  const answers = it.a.map(canon);
  const g = canon(raw);
  const cands = new Set([g]);
  if (it.pre) cands.add(canon(it.pre + raw.trim()));
  // 's after a pronoun can be is or has; 'd can be had or would: try both
  [...cands].forEach(c => {
    const s1 = c.replace(/\b(he|she|it|that|there|what|who|where|here)'s\b/g, '$1 is'), s2 = c.replace(/\b(he|she|it|that|there|what|who|where|here)'s\b/g, '$1 has');
    [s1, s2].forEach(x => { cands.add(x); cands.add(x.replace(/'d\b/g, ' had')); cands.add(x.replace(/'d\b/g, ' would')); });
  });
  [...cands].forEach(c => cands.add(c.replace(/\s+/g, ' ').trim()));
  const strip = s => {
    const out = [s];
    if (prev && s.startsWith(prev + ' ')) out.push(s.slice(prev.length + 1));
    out.slice().forEach(x => { if (next && x.endsWith(' ' + next)) out.push(x.slice(0, -(next.length + 1))); });
    return out;
  };
  [...cands].forEach(c => strip(c).forEach(x => cands.add(x)));
  for (const c of cands) if (answers.includes(c)) return { ok: true };
  for (const c of cands) if (answers.includes(loosen(c))) return { ok: true, note: 'Remember the apostrophe in short forms: don’t, won’t, doesn’t …' };
  return { ok: false };
}

/* ===================== SOUND (generated, no files) ===================== */
const Sfx = (() => {
  let ctx = null;
  function ac(){
    if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ctx = new C(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(f, at, dur, type = 'sine', vol = 0.14, slide = 0){
    const c = ac(); if (!c || store.muted) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    unlock(){ ac(); },
    tap(){ tone(880, 0, 0.05, 'triangle', 0.05); },
    correct(){ tone(784, 0, 0.16, 'triangle', 0.13); tone(1175, 0.08, 0.28, 'triangle', 0.12); },
    wrong(){ tone(240, 0, 0.22, 'sine', 0.13, 0.75); },
    streak(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * 0.07, 0.22, 'triangle', 0.11)); },
    finish(){ [523, 659, 784].forEach((f, i) => tone(f, i * 0.11, 0.35, 'sine', 0.12)); },
    perfect(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, 0.4, 'triangle', 0.11)); tone(2093, 0.5, 0.6, 'sine', 0.06); },
    level(){ [392, 523, 659, 784].forEach((f, i) => tone(f, i * 0.12, 0.3, 'square', 0.05)); [1047, 1319, 1568].forEach(f => tone(f, 0.5, 0.9, 'triangle', 0.08)); }
  };
})();

/* ===================== POOLS & MODES ===================== */
const POOL = { g:{}, m:{}, f:{} };
GAP.forEach(it => (POOL.g[it.p] = POOL.g[it.p] || []).push(it));
MC.forEach(it => (POOL.m[it.p] = POOL.m[it.p] || []).push(it));
FAULT.forEach(it => (POOL.f[it.p] = POOL.f[it.p] || []).push(it));
const sortsFor = p => SORTS.filter(s => s.cards.some(c => c[2] === p));
const matchesFor = p => MATCHES.filter(x => x.p === p);
const mixPool = p => [...(POOL.g[p] || []), ...(POOL.m[p] || []), ...(POOL.f[p] || [])];

  fault:'<svg viewBox="0 0 24 24"><path d="M3 12h5l2-5 4 10 2-5h5"/></svg>',
  sort:'<svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="11" rx="2"/><path d="M5 18l-3 3M19 18l3 3M4 21h4M16 21h4"/></svg>',

};
const MODES = {
  gap:{ name:'Forge', desc:'Type the missing word or words.' },
  mc:{ name:'Three Doors', desc:'Pick the right door. Quick answers earn bonus XP.' },
  fault:{ name:'Fault Line', desc:'Find the mistake in the sentence, then fix it.' },
  sort:{ name:'Split', desc:'Swipe or tap each card into the right group.' },
  match:{ name:'Halves', desc:'Join the two halves of each sentence.' },
  mix:{ name:'Star Mix', desc:'A bit of everything on this grammar point.' }
};
function modesFor(p){
  const m = [];
  if (POOL.g[p]) m.push('gap'); if (POOL.m[p]) m.push('mc'); if (POOL.f[p]) m.push('fault');
  if (sortsFor(p).length) m.push('sort'); if (matchesFor(p).length) m.push('match');
  m.push('mix'); return m;
}
function leastSeen(arr, n, idf){ return shuffle(arr).sort((a, b) => (store.seen[idf(a)] || 0) - (store.seen[idf(b)] || 0)).slice(0, n); }
/* like leastSeen, but skips a question whose key words are already in the round (used); only if the pool
   runs out are skipped questions used to fill the gap */
/* questions that practise a related pattern rather than the point itself (5B: I've ever + past participle,
   ever / never) are limited to RELATED_MAX per round */
const RELATED_RULES = new Set(['sup_pp', 'sup_ever']), RELATED_MAX = 2;
function pickVaried(arr = [], n, used = new Set()){
  const out = [], later = []; let rel = 0;
  for (const it of leastSeen(arr, arr.length, x => x.id)){
    if (out.length >= n) break;
    const ks = it.keys || [], isRel = RELATED_RULES.has(it.r);
    if (ks.some(k => used.has(k)) || (isRel && rel >= RELATED_MAX)) later.push(it); else { out.push(it); ks.forEach(k => used.add(k)); if (isRel) rel++; }
  }
  for (const it of later){ if (out.length >= n) break; out.push(it); (it.keys || []).forEach(k => used.add(k)); }
  return out;
}
const keysOf = e => (e.it && e.it.keys) || [];
const markSeen = id => { store.seen[id] = Date.now(); };
function buildQueue(p, mode){
  const K = { gap:'g', mc:'m', fault:'f' };
  if (K[mode]) return pickVaried(POOL[K[mode]][p], 8).map(it => ({ k: it.k, it }));
  if (mode === 'mix') return pickVaried(mixPool(p), 9).map(it => ({ k: it.k, it }));
  if (mode === 'sort'){ const cards = []; sortsFor(p).forEach(s => s.cards.forEach((c, i) => cards.push({ k:'s', set:s, card:c, id:s.id + '#' + i }))); return leastSeen(cards, 10, x => x.id); }
  if (mode === 'match') return leastSeen(matchesFor(p), 2, x => x.id).map(b => ({ k:'x', board:b, id:b.id }));
  if (mode === 'all'){ const used = new Set(); return shuffle(secPoints().filter(pt => mixPool(pt.id).length)).slice(0, 12).map(pt => { const it = pickVaried(mixPool(pt.id), 1, used)[0]; return { k: it.k, it }; }); }
  if (mode === 'book') return buildReview(SEC);
  if (mode === 'weak'){
    // weak spots come from the mistakes book: the 3 points with most mistakes, some of the missed
    // questions again, then new questions from those points
    const tally = {}; Object.values(store.book).forEach(b => { if (b.sec === SEC && inLive(b)) tally[b.p] = (tally[b.p] || 0) + b.n; });
    const pts = Object.keys(tally).filter(p => mixPool(p).length).sort((a, b) => tally[b] - tally[a]).slice(0, 3);
    const mine = bookItems(SEC, 20).filter(e => pts.includes(bkPoint(e))).slice(0, 4), have = new Set(mine.map(bkKey));
    const used = new Set(mine.flatMap(keysOf));
    const fill = pickVaried(pts.flatMap(mixPool).filter(it => !have.has(it.id)), 10 - mine.length, used).map(it => ({ k: it.k, it }));
    return shuffle([...mine, ...fill]);
  }
  return [];
}

let G = null;

function startRound(p, mode){
  ensureSession();
  const q = buildQueue(p, mode);
  if (!q.length){ toast('Nothing to practise here yet'); return; }
  const total = q.reduce((a, e) => a + (e.k === 'r' ? 0 : e.k === 'x' ? e.board.pairs.length : 1), 0);
  if (!total){ toast('Nothing to practise here yet'); return; }
  G = { p, mode, q, qi: 0, slot: 0, total, c: 0, t: 0, streak: 0, xp: 0, by: {}, mistakes: [], cur: null, missKey: null, start: Date.now(), lvlBefore: levelOf(store.xp), locked: false };
  const label = p === 'ALL' ? 'Mixed revision · ' + THEME[SEC].name : p === 'WEAK' ? 'Weak spots · ' + THEME[SEC].name : p === 'BOOK' ? 'Mistakes review · ' + THEME[SEC].name : `${PT[p].code} · ${MODES[mode].name}`;
  $('#hudTitle').textContent = label;
  show('game'); Sky.setRound(total); updateHud(); renderItem();
}
function updateHud(){
  $('#progFill').style.width = (100 * G.slot / G.total) + '%';
  const sEl = $('#hudStreak'); sEl.textContent = 'streak ' + G.streak; sEl.classList.toggle('hot', G.streak >= 3);
  $('#hudXp').textContent = G.xp + ' XP';
}
function award(ok, p, base, bonus = 0, quiet = false){
  const s = store.stats[p] || (store.stats[p] = { r: [], n: 0, c: 0 });
  s.r.push(ok ? 1 : 0); if (s.r.length > 20) s.r.shift(); s.n++; if (ok) s.c++;
  store.answered = (store.answered || 0) + 1;
  if (G.cur && G.cur.k !== 'x' && G.cur.k !== 'r'){ if (ok) bookHit(G.cur); else G.missKey = bookMiss(G.cur); }
  const b = G.by[p] || (G.by[p] = [0, 0]); b[1]++; G.t++;
  let gained = 0;
  if (ok){
    b[0]++; G.c++; G.streak++;
    gained = base + Math.min(G.streak - 1, 5) * 2 + bonus; G.xp += gained; store.xp += gained;
    if (G.streak > store.bestStreak) store.bestStreak = G.streak;
  } else G.streak = 0;
  Sky.lightStar(G.slot, ok); G.slot++;
  if (!quiet){
    if (ok && G.streak % 5 === 0){ Sfx.streak(); toast(G.streak + ' in a row! ✨'); }
    else if (ok) Sfx.correct(); else Sfx.wrong();
  }
  updateHud(); save();
  return gained;
}

/* ===================== MISTAKES BOOK =====================
   Every wrong answer is kept (store.book), one entry per question, until the student has answered that
   question correctly BOOK_CLEAR times in a row (in review or in normal play). An entry stores the question's
   id and a signature of its text, so if the item bank is edited later a changed question is dropped instead of
   being shown wrongly. Entries: { key, k (g m f s x), p (point), sec, n (misses), ok (correct in a row),
   first, last, sig, h (sentence as html, correct answer marked), y (what they wrote), r (rule key) }. */
const BOOK_CLEAR = 2;
const splitKey = k => { const j = k.lastIndexOf('#'); return [k.slice(0, j), +k.slice(j + 1)]; };
const bkKey = e => e.k === 's' ? e.id : e.it.id;
const bkPoint = e => e.k === 's' ? e.card[2] : e.it.p;
const bkSig = e => e.k === 's' ? e.card[0] + '|' + e.set.id : e.k === 'f' ? e.it.c.join('|') : e.it.t;
function bookDrop(b){ delete store.book[b.key]; store.cleared = (store.cleared || 0) + 1; }
function bookMiss(e){
  const key = bkKey(e), p = bkPoint(e);
  const b = store.book[key] || (store.book[key] = { key, k: e.k, p, sec: PT[p].sec, n: 0, ok: 0, first: Date.now() });
  b.n++; b.ok = 0; b.last = Date.now(); b.sig = bkSig(e); return key;
}
function bookHit(e){ const b = store.book[bkKey(e)]; if (b && ++b.ok >= BOOK_CLEAR) bookDrop(b); }
function bookFill(o){
  const b = store.book[G.missKey]; G.missKey = null; if (!b) return;
  b.h = o.sent || b.h || ''; b.y = o.your || ''; b.r = o.rule || ''; save();
}
function bookMissPair(board, L, R){
  const key = board.id + '#' + L, p = board.p;
  const b = store.book[key] || (store.book[key] = { key, k: 'x', p, sec: PT[p].sec, n: 0, ok: 0, first: Date.now() });
  b.n++; b.ok = 0; b.last = Date.now(); b.sig = board.pairs[L].join('|');
  b.h = esc(board.pairs[L][0]) + ' <mark>' + esc(board.pairs[L][1]) + '</mark>'; b.y = board.pairs[R][1]; b.r = p === '8B' ? 'c_match' : ''; save();
}
function bookHitPair(board, L){ const b = store.book[board.id + '#' + L]; if (b && ++b.ok >= BOOK_CLEAR) bookDrop(b); save(); }
const inLive = b => PT[b.p] && PT[b.p].live;
const bookCount = sec => Object.values(store.book).filter(b => inLive(b) && (!sec || b.sec === sec)).length;

/* turn a stored entry back into a playable queue entry, or null if the question has changed or gone */
function bookResolve(b){
  if (b.k === 'x'){
    const [bid, L] = splitKey(b.key), bd = MATCHES.find(x => x.id === bid);
    return bd && bd.pairs[L] && bd.pairs[L].join('|') === b.sig ? { k: 'x', board: bd, id: bd.id } : null;
  }
  if (b.k === 's'){
    const [sid, i] = splitKey(b.key), s = SORTS.find(x => x.id === sid), c = s && s.cards[i];
    return c && c[0] + '|' + s.id === b.sig ? { k: 's', set: s, card: c, id: b.key } : null;
  }
  const it = ITEM_BY_ID[b.key];
  return it && (it.k === 'f' ? it.c.join('|') : it.t) === b.sig ? { k: it.k, it } : null;
}
/* up to n of this section's most-missed playable questions (not match boards) */
function bookItems(sec, n){
  return Object.values(store.book).filter(b => b.sec === sec && b.k !== 'x' && inLive(b)).sort((a, c) => c.n - a.n || a.last - c.last)
    .map(bookResolve).filter(Boolean).slice(0, n);
}
/* a review round: for the 3 points with most misses, a rule card, the missed questions again, then 2 new ones */
function buildReview(sec){
  const live = [];
  Object.values(store.book).forEach(b => { if (b.sec !== sec || !inLive(b)) return; const r = bookResolve(b); if (r) live.push({ b, r }); else delete store.book[b.key]; });
  save();
  const byP = {}; live.forEach(x => (byP[x.b.p] = byP[x.b.p] || []).push(x));
  const pts = Object.keys(byP).sort((a, c) => byP[c].reduce((s, x) => s + x.b.n, 0) - byP[a].reduce((s, x) => s + x.b.n, 0)).slice(0, 3);
  const q = [], used = new Set(live.flatMap(x => keysOf(x.r)));
  pts.forEach(p => {
    const rows = byP[p].sort((a, c) => c.b.n - a.b.n || a.b.last - c.b.last).slice(0, 4), boards = new Set();
    q.push({ k: 'r', p, rows: rows.map(x => x.b) });
    rows.forEach(x => { if (x.r.k === 'x'){ if (boards.has(x.r.id)) return; boards.add(x.r.id); } q.push(x.r); });
    pickVaried(mixPool(p).filter(it => !store.book[it.id]), 2, used).forEach(it => q.push({ k: it.k, it }));
  });
  return q;
}
function renderReview(e){
  const P = PT[e.p];
  stage().innerHTML = `
    <div class="ins">Review: read these, then try them again</div>
    <div class="rv-head"><b>${P.code}</b> ${esc(P.title)}</div>
    ${e.rows.map(b => `<div class="rv-item"><div class="rv-s">${b.h || ''}</div>${b.y ? `<div class="fb-your">You wrote: <s>${esc(b.y)}</s></div>` : ''}</div>`).join('')}
    ${[...new Set(e.rows.map(b => ruleText(b.r)).filter(Boolean))].map(r => `<div class="fb-rule" style="margin-top:8px">${esc(r)}</div>`).join('')}
    <button class="btn primary wide" id="nextBtn" data-act="next" style="margin-top:12px">Try again</button>`;
}

const plain = h => { const d = document.createElement('div'); d.innerHTML = String(h).replace(/<br\s*\/?>/g, ' '); return d.textContent.replace(/\s+/g, ' ').trim(); };

/* ===================== SHARE WITH MY TEACHER (opt-in) =====================
   Off unless the student turns it on and types a name. Then, after each game, one small message goes to
   the teacher's Google Sheet (teacher-sheet/Code.gs): the name, section, topic, game, score, seconds taken,
   the time the session started, and the wrong answers. Nothing else is sent (no device details, no ids).
   Messages wait in store.outbox until they get through, so results played offline arrive later.
   SHARE_URL is the Sheet's web-app address; while it is empty the whole feature is hidden. */
const SHARE_URL = '';
const SHARE_KEEP = 'about 6 months';   // must match KEEP_DAYS in teacher-sheet/Code.gs
const sharing = () => !!(SHARE_URL && store.share && store.share.on && store.share.name);
function shareRound(){
  if (!sharing() || !G || !G.t) return;
  const P = PT[G.p];
  store.outbox.push({ v: 1, name: store.share.name, sec: THEME[SEC].name, topic: P ? P.code : 'Mixed',
    title: P ? P.title : ({ ALL: 'Mixed revision', WEAK: 'Weak spots', BOOK: 'Mistakes review' })[G.p] || '',
    mode: P ? MODES[G.mode].name : '', c: G.c, t: G.t, secs: Math.round((Date.now() - G.start) / 1000),
    session: store.session ? store.session.start : 0,
    mistakes: G.mistakes.map(m => ({ p: m.p ? PT[m.p].code : '', q: plain(m.sent), a: m.your || '' })) });
  store.outbox = store.outbox.slice(-200); save(); flushOutbox();
}
async function flushOutbox(){
  if (flushOutbox.busy || !SHARE_URL || !store.outbox.length) return;
  flushOutbox.busy = true;
  try {
    while (store.outbox.length && sharing()){
      // text/plain + no-cors: the only way a static page can post to Apps Script; the reply can't be read,
      // so a message counts as sent when the network accepts it
      await fetch(SHARE_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(store.outbox[0]) });
      store.outbox.shift(); save();
    }
  } catch (e) { /* offline: try again after the next game or next time the app opens */ }
  flushOutbox.busy = false;
}
const SHARE_NOTICE = () => `
  <p>This is <b>optional</b>. Nothing is sent unless you turn it on.</p>
  <p><b>If you turn it on</b>, after each game this app sends your teacher:</p>
  <ul class="notice">

  </ul>
  <p><b>It does not send</b> anything else from your phone: no email, no contacts, no location, no device or account details. The app does not record your IP address. (Like every website, Google’s computers see it when the results arrive, as part of normal internet traffic.)</p>
  <p><b>Where it goes:</b> a Google Sheet that only your teacher can open. Google stores the Sheet, so <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google’s privacy policy</a> also applies.</p>
  <p><b>Why:</b> so your teacher can help you, see how much the app is used, and see which topics people find hardest.</p>
  <p><b>How long:</b> results are deleted automatically after ${SHARE_KEEP}.</p>
  <p><b>Stopping:</b> you can turn this off at any time. That stops new results being sent. Results already sent stay in the Sheet until they are deleted automatically, or until your teacher deletes them if you ask.</p>`;
function renderShare(){
  const S = store.share || {}, on = sharing(), wait = store.outbox.length;
  $('#share').innerHTML = `
    <div class="back-row"><button class="btn ghost small back-btn" data-act="ret">${BACK}Back</button><div class="eyebrow">Share with my teacher</div></div>

      ${SHARE_NOTICE()}
      <label class="share-lab" for="shareName">Your name</label>

/* ---- end of round ---- */
function endRound(){
  const r = { p: G.p, mode: G.mode, c: G.c, t: G.t, xp: G.xp, by: G.by, at: Date.now(), sec: SEC };
  if (G.t > 0){ const s = ensureSession(); s.rounds.push(r); s.xp += G.xp; }

function renderResult(){
  const p = pct(G.c, G.t), lp = levelProgress(store.xp);
  const msg = p === 100 ? THEME[SEC].perfect : p >= 80 ? 'Brilliant work!' : p >= 60 ? 'Good – just a few mistakes left.' : 'Keep practising – you\u2019ll get there.';
  const title = G.p === 'ALL' ? 'Mixed revision · ' + THEME[SEC].name : G.p === 'WEAK' ? 'Weak spots · ' + THEME[SEC].name : G.p === 'BOOK' ? 'Mistakes review · ' + THEME[SEC].name : `${PT[G.p].code} ${PT[G.p].title} · ${MODES[G.mode].name}`;
  $('#result').innerHTML = `
    <div class="panel result">
      <div class="eyebrow">${esc(title)}</div>
      <div class="big-score">${G.c}<span>/${G.t}</span></div>
      <div class="res-msg">${msg}</div>
      <div class="res-xp">+${G.xp} XP</div>
      <div class="level-card" style="justify-content:center;text-align:left">
        <div class="lvl-badge" style="width:48px;height:48px;font-size:1.25rem">${lp.L}</div>
        <div class="lvl-info"><div class="lvl-title">${levelName(lp.L)}</div><div class="xpbar"><div style="width:${Math.round(lp.frac * 100)}%"></div></div><div class="muted small">${lp.need - lp.into} XP to level ${lp.L + 1}</div></div>
      </div>
      ${G.mistakes.length ? `<details class="rev"><summary>Review your mistakes (${G.mistakes.length})</summary>${G.mistakes.map(m => `<div class="rev-item">${m.sent}${m.your ? `<div class="yw">You chose: ${esc(m.your)}</div>` : ''}</div>`).join('')}</details>` : ''}
      <div class="btn-col">
        <button class="btn primary wide" data-act="again">Play again</button>
        ${PT[G.p] ? `<button class="btn ghost wide" data-act="point" data-p="${G.p}">Choose another game for ${PT[G.p] ? PT[G.p].code : ''}</button>` : ''}
        ${bookCount() ? `<button class="btn ghost wide" data-act="book">My mistakes book (${bookCount()})</button>` : ''}
        <button class="btn ghost wide" data-act="home">${THEME[SEC].back}</button>
      </div>
    </div>`;
}
function levelUp(L){
  Sfx.level(); Sky.celebrate();
  const o = $('#overlay');
  o.innerHTML = `<div class="panel"><div class="eyebrow">Level up!</div><div class="lvl-badge">${L}</div><h2>${levelName(L)}</h2>
    <p class="muted">You’ve reached level ${L}. Keep going to light up the whole sky.</p><button class="btn primary wide" data-act="closeOverlay">Brilliant!</button></div>`;
  o.classList.add('show');
}

/* ---- session report ---- */
function gradeFor(p){ return p >= 90 ? 'Supernova' : p >= 75 ? 'Bright Star' : p >= 60 ? 'Rising Star' : 'Keep Stargazing'; }
function barsHtml(by, sec){
  return secPoints(sec).filter(p => by[p.id]).map(p => { const [c, t] = by[p.id], v = pct(c, t), col = v >= 80 ? 'var(--teal)' : v >= 60 ? 'var(--gold)' : 'var(--coral)';
    return `<div class="bar"><b>${p.code}</b><div class="bt"><div style="width:${Math.max(v, 3)}%;background:${col}"></div></div><span class="bv">${c}/${t} · ${v}%</span></div>`; }).join('');
}
function renderReport(){
  const st = sessionTotals(), p = pct(st.c, st.t), s = store.session;
  const weak = ALLP.filter(x => st.by[x.id] && pct(st.by[x.id][0], st.by[x.id][1]) < 70);
  const secTot = x => secPoints(x).reduce((a, q) => st.by[q.id] ? [a[0] + st.by[q.id][0], a[1] + st.by[q.id][1]] : a, [0, 0]);
  const gT = secTot('G'), vT = secTot('V');
  const d = new Date();
  $('#report').innerHTML = `
    <div class="back-row"><button class="btn ghost small back-btn" data-act="ret">${BACK}Back</button><div class="eyebrow">Session report</div></div>
    <div class="panel">
      <div class="report-head"><div class="big-score">${p}<span>%</span></div><div class="grade">${gradeFor(p)}</div></div>
      <div class="stat-row">
        <div class="stat"><b>${st.c}/${st.t}</b><span>correct</span></div>
        <div class="stat"><b>${st.xp}</b><span>XP earned</span></div>
        <div class="stat"><b>${st.rounds}</b><span>games</span></div>
      </div>
      ${!st.t ? '<div class="muted small">No answers yet.</div>' : ''}
      ${gT[1] ? `<div class="sec-title">Grammar · ${gT[0]}/${gT[1]} · ${pct(gT[0], gT[1])}%</div><div class="bars">${barsHtml(st.by, 'G')}</div>` : ''}
      ${vT[1] ? `<div class="sec-title">Vocabulary · ${vT[0]}/${vT[1]} · ${pct(vT[0], vT[1])}%</div><div class="bars">${barsHtml(st.by, 'V')}</div>` : ''}
      ${weak.length ? `<div class="sec-title">Focus on</div><div class="focus-chips">${weak.map(x => `<span class="chip">${x.sec === 'V' ? 'Vocab ' : 'Grammar '}${x.code} ${esc(x.title)}</span>`).join('')}</div>` : ''}
      <div class="sec-title">Games played</div>
      <div class="list">${s ? s.rounds.map(r => `<div class="li"><span>${PT[r.p] ? (PT[r.p].sec === 'V' ? 'Vocab ' : 'Grammar ') + PT[r.p].code + ' · ' + MODES[r.mode].name : ({ ALL: 'Mixed revision', WEAK: 'Weak spots', BOOK: 'Mistakes review' })[r.p] + ' · ' + THEME[r.sec || 'G'].name}</span><b>${r.c}/${r.t}</b></div>`).join('') : ''}</div>
      <div class="stamp">Level ${levelOf(store.xp)} ${levelName(levelOf(store.xp))} · ${d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' })} ${d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })}</div>
    </div>
    <div class="btn-col">
      <button class="btn primary wide" data-act="ret">Keep playing</button>
      <button class="btn ghost wide" data-act="endSession">Finish this session and start a new one</button>
    </div>`;
}
function endSession(){
  const st = sessionTotals();
  if (st.t > 0){ store.history.unshift({ start: store.session.start, end: Date.now(), c: st.c, t: st.t, xp: st.xp, by: st.by, games: st.rounds }); store.history = store.history.slice(0, 40); }
  store.session = null; save(); toast('Session saved'); goLanding();
}

/* ---- history & progress ---- */
function renderHistory(){
  const lp = levelProgress(store.xp);
  const fmtD = t => new Date(t).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ' ' + new Date(t).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
  $('#history').innerHTML = `
    <div class="back-row"><button class="btn ghost small back-btn" data-act="ret">${BACK}Back</button><div class="eyebrow">Progress & history</div></div>
    <div class="panel">
      <div class="stat-row">
        <div class="stat"><b>${lp.L}</b><span>level</span></div>
        <div class="stat"><b>${store.xp}</b><span>total XP</span></div>
        <div class="stat"><b>${store.bestStreak}</b><span>best streak</span></div>
      </div>
      <div class="muted small" style="text-align:center">${store.answered || 0} answers so far</div>
      ${['G', 'V'].map(x => `<div class="sec-title">${THEME[x].name} (your last 20 answers on each)</div>
      <div class="list">${secPoints(x).map(p => { const a = recentAcc(p.id); return `<div class="li"><span><b>${p.code}</b> ${esc(p.title)}</span><span>${starsHtml(mastery(p.id))} <span class="muted small">${a === null ? '–' : Math.round(a * 100) + '%'}</span></span></div>`; }).join('')}</div>`).join('')}
      <div class="sec-title">Past sessions</div>
      <div class="list">${store.history.length ? store.history.map(h => `<div class="li"><span>${fmtD(h.end)} · ${h.games} game${h.games === 1 ? '' : 's'}</span><b>${h.c}/${h.t} · ${pct(h.c, h.t)}%</b></div>`).join('') : '<div class="muted small">Finished sessions appear here. Open the session report and tap “Finish this session”.</div>'}</div>
      <div class="muted small" style="margin-top:14px">${sharing() ? 'Your progress is saved in this browser on this phone. Because you turned on <b>Share results with my teacher</b>, each game’s score and wrong answers are also sent to your teacher, under the name you chose.' : 'Your progress is saved only in this browser on this phone. None of it is sent anywhere.'}</div>
    </div>
    <div class="btn-col"><button class="btn ghost wide" data-act="reset">Reset all progress</button></div>`;
}
function renderHelp(){
  $('#help').innerHTML = `
    <div class="back-row"><button class="btn ghost small back-btn" data-act="ret">${BACK}Back</button><div class="eyebrow">How to play</div></div>
    <div class="panel help">
      <h3>Grammar and vocabulary</h3><p>Choose <b>Grammar</b> (the Observatory) or <b>Vocabulary</b> (the Workshop) on the first screen. Each grammar point or vocabulary topic has five stars. Your stars come from your last 20 answers on it, so keep practising to get all five.</p>
      <h3>The games</h3>
      <p><b>Forge</b> – type the missing words. Short forms are fine: <i>won’t</i> and <i>will not</i> are both correct. If the first letters are given, you can type the whole word or just the missing letters.</p>
      <p><b>Three Doors</b> – choose the right answer. Answer within 6 seconds for bonus XP.</p>
      <p><b>Fault Line</b> – tap the wrong part of the sentence, then choose the correction.</p>
      <p><b>Split</b> – swipe or tap each card into the right group.</p>
      <p><b>Halves</b> – match the beginnings and endings of sentences.</p>
      <p><b>Star Mix</b> and <b>Mixed revision</b> mix the game types together. <b>Weak spots</b> opens after your first mistake: it takes the three points you have made most mistakes on, gives you some of those questions again and adds new ones.</p>
      <h3>My mistakes book</h3><p>Every question you get wrong is saved in <b>My mistakes</b>, with the rule. Open it from the menu to review them: you see what you wrote, the right answer and the rule, try the questions again, and get a few new questions on the same point. Get a question right twice in a row and it leaves the book. You can save the book as a text file or copy it into a notes app.</p>
      <h3>Scores</h3><p>Every correct answer earns XP, with extra XP for streaks. All your games add up into one <b>session report</b> – open it from the top of any menu screen. When you finish a session, it’s saved in your history.</p>
      <h3>Your data</h3><p>Your progress, stars and mistakes book are saved only in this browser on this phone. ${SHARE_URL ? (sharing() ? 'You have turned on <b>Share results with my teacher</b>, so each game’s score and wrong answers are also sent to your teacher, under the name you chose. You can turn this off on the first screen.' : 'Nothing is sent to your teacher unless you turn on <b>Share results with my teacher</b> on the first screen.') : 'None of it is sent anywhere.'}</p>
      <p class="muted small">Like any website, opening this page contacts the companies that deliver it: GitHub (which hosts the page), Google Fonts (the lettering) and cdnjs by Cloudflare (the 3D sky). Their servers see your IP address as part of normal internet traffic. This app does not record it.</p>
    </div>`;
}

let retTo = 'landing';
const curScreen = () => { const a = $('.screen.active'); return a && a.id === 'home' ? 'home' : 'landing'; };
function goLanding(){ applyTheme('G'); renderLanding(); show('landing'); }
function ask(title, text, yes, fn){
  ask.fn = fn; const o = $('#overlay');
  o.innerHTML = `<div class="panel"><h2>${esc(title)}</h2><p class="muted">${esc(text)}</p>
    <div class="btn-col"><button class="btn primary wide" data-act="askYes">${esc(yes)}</button><button class="btn ghost wide" data-act="closeOverlay">Cancel</button></div></div>`;
  o.classList.add('show');
}
/* ===================== EVENTS ===================== */
document.addEventListener('pointerdown', () => Sfx.unlock(), { once: true });
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  switch (act){
    case 'point': Sfx.tap(); renderPoint(el.dataset.p); show('point'); break;
    case 'start': Sfx.tap(); startRound(el.dataset.p, el.dataset.mode); break;
    case 'home': renderHome(); show('home'); break;
    case 'landing': goLanding(); break;
    case 'section': Sfx.tap(); setSection(el.dataset.s); renderHome(); show('home'); break;
    case 'ret': if (retTo === 'home') { renderHome(); show('home'); } else goLanding(); break;
    case 'mute': store.muted = !store.muted; save(); el.innerHTML = MUTE_ICON(store.muted); if (!store.muted) Sfx.correct(); break;
    case 'opt': chooseOpt(el); break;
    case 'chunk': chooseChunk(el); break;
    case 'fix': chooseFix(el); break;
    case 'bin': chooseBin(+el.dataset.bin); break;
    case 'ml': matchTap('l', el); break;
    case 'mr': matchTap('r', el); break;
    case 'next': next(); break;
    case 'why': { const r = $('.fb-rule'); if (r) r.classList.remove('hide-rule'); el.remove(); break; }
    case 'again': startRound(G.p, G.mode); break;
    case 'quit':
      if (G && G.t > 0){ const s = ensureSession(); s.rounds.push({ p: G.p, mode: G.mode, c: G.c, t: G.t, xp: G.xp, by: G.by, at: Date.now(), sec: SEC }); s.xp += G.xp; save(); shareRound(); }
      { const back = G && PT[G.p] ? G.p : null; G = null;
        if (back){ renderPoint(back); show('point'); } else { renderHome(); show('home'); } }
      break;
    case 'report': retTo = curScreen(); renderReport(); show('report'); break;
    case 'endSession': ask('Finish this session?', 'It will be saved in your history and a new session will start.', 'Finish session', endSession); break;
    case 'history': retTo = curScreen(); renderHistory(); show('history'); break;
    case 'help': retTo = curScreen(); renderHelp(); show('help'); break;
    case 'reset':
      ask('Reset ALL progress?', 'Your XP, stars, mistakes book and history on this phone will be deleted. This cannot be undone.', 'Delete everything', () => {
        const m = store.muted; store = freshStore(); store.muted = m; save(); goLanding(); toast('Progress reset');
      });
      break;
    case 'askYes': { const fn = ask.fn; ask.fn = null; $('#overlay').classList.remove('show'); if (fn) fn(); break; }
    case 'book': retTo = curScreen(); Sfx.tap(); renderBook(); show('book'); break;
    case 'bookReview': { const sec = el.dataset.s; if (!bookCount(sec)){ toast('Nothing to review here yet'); break; } if (SEC !== sec) setSection(sec); Sfx.tap(); startRound('BOOK', 'book'); break; }
    case 'bookSave': saveText('my-mistakes-' + new Date().toISOString().slice(0, 10) + '.txt', bookText()); break;
    case 'bookCopy': copyText(bookText()); break;
    case 'share': retTo = 'landing'; Sfx.tap(); renderShare(); show('share'); break;
    case 'shareOn': { const n = $('#shareName').value.trim().slice(0, 40); if (!n){ toast('Please type a name first'); $('#shareName').focus(); break; }
      const was = sharing(); store.share = { on: true, name: n }; save(); toast(was ? 'Name saved' : 'Sharing is on'); renderShare(); flushOutbox(); break; }
    case 'shareOff': store.share = { on: false, name: store.share.name }; store.outbox = []; save(); toast('Sharing is off'); renderShare(); break;
    case 'closeOverlay': $('#overlay').classList.remove('show'); break;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || !$('#game').classList.contains('active')) return;
  const nb = $('#nextBtn'); if (nb && document.activeElement !== nb){ ev.preventDefault(); nb.click(); }
});

/* ===================== BOOT ===================== */
if (PREVIEW){ const t = document.createElement('div'); t.className = 'preview-tag'; t.textContent = 'Teacher preview: all units visible'; document.body.appendChild(t); }
renderLanding(); document.body.dataset.theme = 'sky';
flushOutbox();
(function loadThree(){
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  s.async = true; s.onload = () => Sky.init();
  document.head.appendChild(s);
})();
</script>
</body>
</html>
